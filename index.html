  .header p { color: var(--text-muted); font-size: 0.95rem; }

  .badge.marathon { color: var(--accent-blue); border: 1px solid var(--accent-blue); }
  .badge.half { color: var(--accent-purple); border: 1px solid var(--accent-purple); }
  .badge.race15k { color: var(--accent-amber); border: 1px solid var(--accent-amber); }
  .badge.physio { color: var(--accent-emerald); border: 1px solid var(--accent-emerald); }
  .badge.transit { color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

  .nav-container { max-width: 1400px; margin: 0 auto 20px auto; }
  .week-selector { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; margin-bottom: 12px; }
  .week-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
  .week-btn.active, .week-btn:hover { background: var(--accent-blue); color: var(--bg-primary); border-color: var(--accent-blue); }
  
  .day-selector { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 4px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 0.82rem; transition: all 0.2s; }
  .day-btn.active { background: var(--accent-emerald); color: var(--bg-primary); border-color: var(--accent-emerald); font-weight: bold; }
  .day-btn.race-day { border-color: var(--accent-rose); color: var(--accent-rose); font-weight: bold; }
  .day-btn.race-day.active { background: var(--accent-rose); color: #fff; }

  .content-container { max-width: 1400px; margin: 0 auto; }
  .day-view { display: none; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .day-view.active { display: block; }
  
  .day-summary-banner { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; background: var(--bg-tertiary); padding: 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border); }
  .metric-item { display: flex; flex-direction: column; }
  .metric-label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .metric-val { font-size: 1.05rem; font-weight: bold; color: var(--text-primary); margin-top: 2px; }
  .metric-val.alert { color: var(--accent-rose); }
  .metric-val.highlight { color: var(--accent-blue); }
  .metric-val.transit-highlight { color: var(--accent-cyan); }

  .timeline { position: relative; border-left: 2px solid var(--border); margin-left: 20px; padding-left: 20px; }
  .timeline-entry { position: relative; margin-bottom: 22px; }
  .timeline-entry::before { content: ""; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
  .timeline-entry.run::before { background: var(--accent-blue); box-shadow: 0 0 6px var(--accent-blue); }
  .timeline-entry.strength::before { background: var(--accent-purple); }
  .timeline-entry.nutrition::before { background: var(--accent-emerald); }
  .timeline-entry.work::before { background: var(--accent-amber); }
  .timeline-entry.transit::before { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }
  .timeline-entry.race::before { background: var(--accent-rose); box-shadow: 0 0 10px var(--accent-rose); }

  .time-stamp { font-size: 0.82rem; font-weight: bold; color: var(--text-muted); margin-bottom: 4px; }
  .entry-card { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
  .entry-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .entry-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
  .tag-run { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
  .tag-strength { background: rgba(192, 132, 252, 0.2); color: var(--accent-purple); }
  .tag-nutrition { background: rgba(52, 211, 153, 0.2); color: var(--accent-emerald); }
  .tag-desk { background: rgba(251, 191, 36, 0.2); color: var(--accent-amber); }
  .tag-transit { background: rgba(34, 211, 238, 0.2); color: var(--accent-cyan); }
  .tag-race { background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); }

  .entry-body { font-size: 0.88rem; color: #cbd5e1; }
  .entry-body ul { margin-left: 20px; margin-top: 6px; }
  .entry-body li { margin-bottom: 4px; }

  @media(max-width: 768px) {
    .day-selector { grid-template-columns: repeat(4, 1fr); }
    .timeline { margin-left: 10px; padding-left: 14px; }
    .timeline-entry::before { left: -21px; }
  }
</style>

let currentWeekIdx = 0;
let currentDayIdx = 0;

function renderWeekSelector() {
  const container = document.getElementById('weekSelector');
  container.innerHTML = '';
  weeksData.forEach((week, idx) => {
    const btn = document.createElement('button');
    btn.className = `week-btn ${idx === currentWeekIdx ? 'active' : ''}`;
    btn.innerText = `Week ${week.weekNum}`;
    btn.onclick = () => {
      currentWeekIdx = idx;
      currentDayIdx = 0;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDaySelector() {
  const container = document.getElementById('daySelector');
  container.innerHTML = '';
  const currentWeek = weeksData[currentWeekIdx];
  currentWeek.days.forEach((day, idx) => {
    const btn = document.createElement('button');
    const isRace = day.type.includes('RACE') || day.type.includes('Big Texas') || day.type.includes('Marathon') || day.type.includes('Turkey Trot');
    btn.className = `day-btn ${idx === currentDayIdx ? 'active' : ''} ${isRace ? 'race-day' : ''}`;
    btn.innerHTML = `<div>${day.date.split(',')[0]}</div><div style="font-size:0.7rem;margin-top:2px;">${day.date.split(',')[1]}</div>`;
    btn.onclick = () => {
      currentDayIdx = idx;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDayView() {
  const container = document.getElementById('dayViewContainer');
  const day = weeksData[currentWeekIdx].days[currentDayIdx];
  
  let html = `
    <div class="day-view active">
      <div style="margin-bottom: 16px;">
        <h2 style="font-size: 1.4rem; color: var(--accent-blue);">${day.date} — ${day.type}</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">${weeksData[currentWeekIdx].title} | ${weeksData[currentWeekIdx].theme}</p>
      </div>

      <div class="day-summary-banner">
        <div class="metric-item">
          <span class="metric-label">Running Demand</span>
          <span class="metric-val highlight">${day.runDist}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Transit / Longevity</span>
          <span class="metric-val transit-highlight">${day.transitLoad}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Strength / Mobility</span>
          <span class="metric-val">${day.strength}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Carb Target (70.3 kg)</span>
          <span class="metric-val">${day.carbTarget}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Civil Twilight Horizon</span>
          <span class="metric-val alert">${day.civilTwilight}</span>
        </div>
      </div>

      <div class="timeline">
  `;

  day.timeline.forEach(item => {
    let tagClass = 'tag-run';
    if(item.type === 'strength') tagClass = 'tag-strength';
    if(item.type === 'nutrition') tagClass = 'tag-nutrition';
    if(item.type === 'work') tagClass = 'tag-desk';
    if(item.type === 'transit') tagClass = 'tag-transit';
    if(item.type === 'race') tagClass = 'tag-race';

    html += `
      <div class="timeline-entry ${item.type}">
        <div class="time-stamp">${item.time}</div>
        <div class="entry-card">
          <div class="entry-title">
            <span>${item.title}</span>
            <span class="entry-tag ${tagClass}">${item.tag}</span>
          </div>
          <div class="entry-body">${item.body}</div>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function renderAll() {
  renderWeekSelector();
  renderDaySelector();
  renderDayView();
}

renderAll();
</script>
