<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-3:15 MED Execution</title>
<style>
  :root {
    --bg-primary: #0a0f1d;
    --bg-secondary: #131d31;
    --bg-tertiary: #1f2e4d;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent-blue: #38bdf8;
    --accent-emerald: #34d399;
    --accent-amber: #fbbf24;
    --accent-rose: #f43f5e;
    --accent-purple: #c084fc;
    --accent-cyan: #22d3ee;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; padding: 20px; }
  .header { max-width: 1400px; margin: 0 auto 20px auto; background: var(--bg-secondary); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
  .header h1 { font-size: 1.8rem; color: var(--accent-rose); margin-bottom: 6px; }
  .header p { color: var(--text-muted); font-size: 0.95rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .badge { background: var(--bg-tertiary); padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge.marathon { color: var(--accent-blue); border: 1px solid var(--accent-blue); }
  .badge.physio { color: var(--accent-emerald); border: 1px solid var(--accent-emerald); }
  .badge.alert { color: var(--accent-rose); border: 1px solid var(--accent-rose); }

  .nav-container { max-width: 1400px; margin: 0 auto 20px auto; }
  .week-selector { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; margin-bottom: 12px; }
  .week-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
  .week-btn.active, .week-btn:hover { background: var(--accent-blue); color: var(--bg-primary); border-color: var(--accent-blue); }
  
  .day-selector { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-btn { background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 4px; border-radius: 8px; cursor: pointer; text-align: center; font-size: 0.82rem; transition: all 0.2s; }
  .day-btn.active { background: var(--accent-emerald); color: var(--bg-primary); border-color: var(--accent-emerald); font-weight: bold; }
  .day-btn.race-day { border-color: var(--accent-rose); color: var(--accent-rose); font-weight: bold; }
  .day-btn.race-day.active { background: var(--accent-rose); color: #fff; }

  .content-container { max-width: 1400px; margin: 0 auto; }
  .day-view { display: none; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .day-view.active { display: block; }
  
  .day-summary-banner { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; background: var(--bg-tertiary); padding: 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border); }
  .metric-item { display: flex; flex-direction: column; }
  .metric-label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .metric-val { font-size: 1.05rem; font-weight: bold; color: var(--text-primary); margin-top: 2px; }
  .metric-val.alert { color: var(--accent-rose); }
  .metric-val.highlight { color: var(--accent-blue); }

  .timeline { position: relative; border-left: 2px solid var(--border); margin-left: 20px; padding-left: 20px; }
  .timeline-entry { position: relative; margin-bottom: 22px; }
  .timeline-entry::before { content: ""; position: absolute; left: -27px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
  .timeline-entry.run::before { background: var(--accent-blue); box-shadow: 0 0 6px var(--accent-blue); }
  .timeline-entry.strength::before { background: var(--accent-purple); }
  .timeline-entry.nutrition::before { background: var(--accent-emerald); }
  .timeline-entry.race::before { background: var(--accent-rose); box-shadow: 0 0 10px var(--accent-rose); }

  .time-stamp { font-size: 0.82rem; font-weight: bold; color: var(--text-muted); margin-bottom: 4px; }
  .entry-card { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
  .entry-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .entry-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
  .tag-run { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
  .tag-strength { background: rgba(192, 132, 252, 0.2); color: var(--accent-purple); }
  .tag-nutrition { background: rgba(52, 211, 153, 0.2); color: var(--accent-emerald); }
  .tag-race { background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); }

  .entry-body { font-size: 0.88rem; color: #cbd5e1; }
  
  @media(max-width: 768px) {
    .day-selector { grid-template-columns: repeat(4, 1fr); }
    .timeline { margin-left: 10px; padding-left: 14px; }
    .timeline-entry::before { left: -21px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Minimum Effective Dose (MED) Dashboard</h1>
  <p>David Resetar | Target: 3:14:00 | Work Window: 7:15 AM – 5:30 PM CT | Nov 16 to Dec 13</p>
  <div class="badges">
    <span class="badge alert">160+ lbs Protocol: Drop Junk Miles, Maximize Protein</span>
    <span class="badge marathon">Dec 13: BMW Dallas Marathon</span>
    <span class="badge physio">130g+ Protein/Day MANDATORY</span>
  </div>
</div>

<div class="nav-container">
  <div class="week-selector" id="weekSelector"></div>
  <div class="day-selector" id="daySelector"></div>
</div>

<div class="content-container" id="dayViewContainer"></div>

<script>
const masterRawData = [
  {
    weekNum: 7, title: "Week 7: 32k Shift & Structural Protection (Nov 16 – Nov 22)", theme: "Absorb the 32km, Drop Mid-Week Volume, Execute 34km Peak",
    daysBlueprint: [
      { dayName: "Mon, Nov 16", type: "Shifted Peak Long Run", run: "32.0 km (19.9 mi) @ 5:25/km", strength: "Foam Roll, Legs-up-the-wall", carbs: "135g Protein MINIMUM", dusk: "Ends 5:26 PM CT" },
      { dayName: "Tue, Nov 17", type: "Total Rest (System Flush)", run: "0.0 mi (Complete Rest - Cut to save joints)", strength: "Zero Lifting. Epsom salt bath.", carbs: "Hydration Flush: 1 Gal Water", dusk: "Ends 5:48 PM CT" },
      { dayName: "Wed, Nov 18", type: "Travel & CNS Deload", run: "0.0 mi (Complete Rest)", strength: "Airport Walking Only", carbs: "135g Protein MINIMUM", dusk: "Ends 5:07 PM PST" },
      { dayName: "Thu, Nov 19", type: "Hotel Tension Maintenance", run: "0.0 mi (Complete Rest)", strength: "Bodyweight Circuit (No Lunges)", carbs: "135g Protein MINIMUM", dusk: "Ends 5:06 PM PST" },
      { dayName: "Fri, Nov 20", type: "Return Travel & Pre-Fueling", run: "0.0 mi (Complete Rest)", strength: "Legs-up-the-wall (10m)", carbs: "Clean Carbs Only (Rice/Potatoes)", dusk: "Ends 5:46 PM CT" },
      { dayName: "Sat, Nov 21", type: "Post-Travel Shakeout", run: "5.0 km (3.1 mi) @ 5:30/km", strength: "Zero lifting", carbs: "450g Clean Carbs", dusk: "Ends 5:46 PM CT" },
      { dayName: "Sun, Nov 22", type: "The Final Monster: 34 km Peak", run: "34.0 km (21.1 mi): 26 km Easy, 8 km @ MP 4:36/km", strength: "Full Rest, Nap", carbs: "135g Protein / 80g CHO/hr during run", dusk: "Ends 5:45 PM CT" }
    ]
  },
  {

    daysBlueprint: [
      { dayName: "Mon, Nov 23", type: "Full Rest & Recovery", run: "0.0 mi (Full Rest)", strength: "Contrast shower, foam roll", carbs: "135g Protein MINIMUM", dusk: "Ends 5:45 PM CT" },
      { dayName: "Tue, Nov 24", type: "MP Tempo Lock", run: "8.0 km (5.0 mi) @ MP 4:36/km (No VO2 Max)", strength: "Pull-ups, Planks (No lower body lifting)", carbs: "135g Protein MINIMUM", dusk: "Ends 5:44 PM CT" },

      { dayName: "Thu, Nov 26", type: "Fort Worth Turkey Trot 8K", run: "8.0 km Race @ MP 4:36/km (Do NOT Sprint)", strength: "Thanksgiving Meal Management", carbs: "Avoid heavy salt/junk sides", dusk: "Ends 5:44 PM CT" },
      { dayName: "Fri, Nov 27", type: "Full Rest & Recovery", run: "0.0 mi (Complete Rest)", strength: "Light stretching", carbs: "135g Protein MINIMUM", dusk: "Ends 5:44 PM CT" },
      { dayName: "Sat, Nov 28", type: "Aerobic Shakeout", run: "5.0 km (3.1 mi) Light Jogging @ 5:30/km", strength: "Legs-up-the-wall", carbs: "Clean Carbs", dusk: "Ends 5:44 PM CT" },
      { dayName: "Sun, Nov 29", type: "Taper Long Run: 22 km", run: "22.0 km (13.7 mi) @ 5:25/km", strength: "Nap, Tart Cherry", carbs: "135g Protein MINIMUM", dusk: "Ends 5:44 PM CT" }
    ]
  },
  {
    weekNum: 9, title: "Week 9: Taper Phase 2 (Nov 30 – Dec 06)", theme: "Volume Drop -40% | MP Memorization & Joint Preservation",
    daysBlueprint: [
      { dayName: "Mon, Nov 30", type: "Full Rest", run: "0.0 mi (Full Rest)", strength: "Foam roll", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Tue, Dec 01", type: "Marathon Pace Lock Reps", run: "3x1 mile @ MP 4:36/km (7:24/mi) w/ 90s walk", strength: "Dead Hangs", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Wed, Dec 02", type: "Full Rest (Volume Cut)", run: "0.0 mi (Complete Rest)", strength: "Gentle mobility", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Thu, Dec 03", type: "Conversational Base", run: "6.0 km (3.7 mi) @ 5:30/km", strength: "Dead Hangs", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Fri, Dec 04", type: "Full Rest", run: "0.0 mi (Complete Rest)", strength: "Legs-up-the-wall", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Sat, Dec 05", type: "Shakeout", run: "5.0 km (3.1 mi) Light Jogging", strength: "Zero lifting", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Sun, Dec 06", type: "Relaxed Taper Run: 16 km", run: "16.0 km (10.0 mi) Relaxed Zone 2 @ 5:30/km", strength: "Nap, Tart Cherry", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" }
    ]
  },
  {
    weekNum: 10, title: "Week 10: BMW Dallas Marathon Race Week (Dec 07 – Dec 13)", theme: "Maximum Freshness | Low-Fiber Carb Load & Sub-3:15 Execution",
    daysBlueprint: [
      { dayName: "Mon, Dec 07", type: "Full Rest", run: "0.0 mi (Full Rest)", strength: "Light mobility", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Tue, Dec 08", type: "Cadence Primer", run: "4x400m @ MP 4:36/km w/ 90s walk (NO SPRINTING)", strength: "Dead Hangs", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Wed, Dec 09", type: "Full Rest", run: "0.0 mi (Complete Rest)", strength: "Grocery Shopping", carbs: "135g Protein MINIMUM", dusk: "Ends 5:43 PM CT" },
      { dayName: "Thu, Dec 10", type: "Final CNS Strides & CARB LOAD", run: "4.0 km (2.5 mi) Easy Jog + 2x15s Strides", strength: "Zero lifting", carbs: "600g Low-Fiber Carbs", dusk: "Ends 5:44 PM CT" },
      { dayName: "Fri, Dec 11", type: "CARB LOAD DAY 2", run: "0.0 mi (Full Rest)", strength: "Dallas Expo Packet Pickup", carbs: "600g Low-Fiber Carbs", dusk: "Ends 5:44 PM CT" },
      { dayName: "Sat, Dec 12", type: "RACE EVE: Shakeout", run: "3.0 km (1.8 mi) 15-Min Easy Walk/Jog", strength: "Lay out gear, sleep by 9 PM", carbs: "650g Low-Fiber Carbs", dusk: "Ends 5:44 PM CT" },
      { dayName: "Sun, Dec 13", type: "MAIN EVENT: BMW Dallas Marathon", run: "42.195 km (26.22 mi) Locked @ 4:36/km | Target: 3:14:00", strength: "Collect Medal", carbs: "80g CHO/hr during race", dusk: "Ends 5:44 PM CT" }
    ]
  }
];

function generateDetailedTimeline(day) {
  const isHardRun = day.run.includes("@ MP") || day.run.includes("32.0 km") || day.run.includes("34.0 km");
  const isRest = day.run.includes("0.0 mi");

  if (day.dayName.includes("Dec 13")) {
    return [
      { time: "05:15 AM", type: "nutrition", tag: "RACE MORNING", title: "Pre-Race Fuel", body: "Bagel w/ honey + banana + 500mg sodium in water." },
      { time: "08:30 AM", type: "race", tag: "RACE", title: "BMW Dallas Marathon: 3:14:00 Target", body: "Lock into 4:36/km (7:24/mi). Listen to your heart rate. If 160 lbs pushes you into Zone 4 early, back off 5 sec/km. Do not fight cardiac drift." },
      { time: "11:45 AM", type: "nutrition", tag: "RECOVERY", title: "Immediate Protein Triage", body: "40g Whey Isolate immediately to stop muscle breakdown." }
    ];
  }

  if (day.dayName.includes("Nov 16")) {
    return [
      { time: "01:30 PM", type: "nutrition", tag: "PROTEIN TRIAGE", title: "Pre-Run Amino Acid Saturation", body: "Consume 30-40g Whey Isolate NOW. Your muscles need amino acids circulating before you tear them down for 3 hours." },
      { time: "02:33 PM – 05:26 PM", type: "run", tag: "LONG RUN", title: "32 km (19.9 mi) Steady Endurance", body: "Hold 5:25/km. Respect the extra weight. Hydrate constantly. Ends exactly at 5:26 PM sunset." },
      { time: "05:30 PM", type: "nutrition", tag: "RECOVERY", title: "Post-Run Protein", body: "Another 40g Whey Isolate. You must hit 140g total today to repair this damage." }
    ];
  }

  if (isRest) {
    return [
      { time: "All Day", type: "nutrition", tag: "HYDRATION & PROTEIN", title: "The Inflammation Flush", body: "Drink 1 gallon of water with potassium-rich electrolytes to shed junk food water retention. Hit 135g protein minimum." },
      { time: "05:00 PM", type: "strength", tag: "RECOVERY", title: "Structural Preservation", body: day.strength }
    ];
  }

  return [
    { time: "All Day", type: "nutrition", tag: "MACROS", title: "Protein Priority", body: "Hit 135g protein. Eliminate empty calories (pastries/sugar) to drop water weight safely." },
    { time: "04:30 PM – 05:45 PM", type: "run", tag: "RUN", title: "Minimum Effective Dose Run", body: day.run + `. Ends by civil twilight: ${day.dusk}` },
    { time: "06:00 PM", type: "strength", tag: "STRENGTH", title: "Maintenance", body: day.strength }
  ];
}

const weeksData = masterRawData.map(w => ({
  weekNum: w.weekNum,
  title: w.title,
  theme: w.theme,
  days: w.daysBlueprint.map(d => ({
    date: d.dayName,
    type: d.type,
    runDist: d.run,
    strength: d.strength,
    carbTarget: d.carbs,
    civilTwilight: d.dusk,
    timeline: generateDetailedTimeline(d)
  }))
}));

let currentWeekIdx = 0;
let currentDayIdx = 0;

function renderWeekSelector() {
  const container = document.getElementById('weekSelector');
  container.innerHTML = '';
  weeksData.forEach((week, idx) => {
    const btn = document.createElement('button');
    btn.className = `week-btn ${idx === currentWeekIdx ? 'active' : ''}`;
    btn.innerText = `Week ${week.weekNum}`;
    btn.onclick = () => {
      currentWeekIdx = idx;
      currentDayIdx = 0;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDaySelector() {
  const container = document.getElementById('daySelector');
  container.innerHTML = '';
  const currentWeek = weeksData[currentWeekIdx];
  currentWeek.days.forEach((day, idx) => {
    const btn = document.createElement('button');
    const isRace = day.type.includes('RACE') || day.type.includes('Marathon') || day.type.includes('Turkey Trot');
    btn.className = `day-btn ${idx === currentDayIdx ? 'active' : ''} ${isRace ? 'race-day' : ''}`;
    btn.innerHTML = `<div>${day.date.split(',')[0]}</div><div style="font-size:0.7rem;margin-top:2px;">${day.date.split(',')[1]}</div>`;
    btn.onclick = () => {
      currentDayIdx = idx;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDayView() {
  const container = document.getElementById('dayViewContainer');
  const day = weeksData[currentWeekIdx].days[currentDayIdx];
  
  let html = `
    <div class="day-view active">
      <div style="margin-bottom: 16px;">
        <h2 style="font-size: 1.4rem; color: var(--accent-rose);">${day.date} — ${day.type}</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">${weeksData[currentWeekIdx].title} | ${weeksData[currentWeekIdx].theme}</p>
      </div>

      <div class="day-summary-banner">
        <div class="metric-item">
          <span class="metric-label">Running Demand (MED)</span>
          <span class="metric-val highlight">${day.runDist}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Strength / Mobility</span>
          <span class="metric-val">${day.strength}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Nutrition Target</span>
          <span class="metric-val alert">${day.carbTarget}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Civil Twilight Horizon</span>
          <span class="metric-val">${day.civilTwilight}</span>
        </div>
      </div>

      <div class="timeline">
  `;

  day.timeline.forEach(item => {
    let tagClass = 'tag-run';
    if(item.type === 'strength') tagClass = 'tag-strength';
    if(item.type === 'nutrition') tagClass = 'tag-nutrition';
    if(item.type === 'race') tagClass = 'tag-race';

    html += `
      <div class="timeline-entry ${item.type}">
        <div class="time-stamp">${item.time}</div>
        <div class="entry-card">
          <div class="entry-title">
            <span>${item.title}</span>
            <span class="entry-tag ${tagClass}">${item.tag}</span>
          </div>
          <div class="entry-body">${item.body}</div>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function renderAll() {
  renderWeekSelector();
  renderDaySelector();
  renderDayView();
}

renderAll();
</script>

</body>
</html>
