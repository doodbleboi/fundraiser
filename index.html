      { time: "08:30 AM – 09:30 AM", type: "race", tag: "10K RACE", title: "Charlie Brown Christmas 10K", body: "Run purely as a celebratory active recovery flush @ >5:30/km (8:51+/mi). Enjoy the holiday atmosphere." },
      { time: "10:00 AM – 05:00 PM", type: "work", tag: "CELEBRATION", title: "Holiday Brunch & Celebration", body: "Celebratory brunch with family/friends. Complete cognitive relaxation." },
      { time: "06:00 PM – 07:30 PM", type: "nutrition", tag: "DINNER", title: "Holiday Dinner & Omega-3s", body: "Wholesome holiday dinner. 2 softgels NOW Omega-3 Fish Oil." },
      { time: "08:30 PM – 09:30 PM", type: "nutrition", tag: "RECOVERY", title: "Sleep Protocol", body: "200mg Magnesium Bisglycinate. Bed by 09:30 PM." }
    ];
  }

  if (isWeekend) {
    const isLongRunSunday = isSunday && !isRest;
    return [
      { time: "05:30 AM – 06:00 AM", type: "nutrition", tag: "PRIMER", title: "Morning Fuel & Hydration", body: "300 mL water + electrolytes + 1 banana or bagel w/ honey." },
      { time: "06:00 AM – 08:45 AM", type: "run", tag: "RUN", title: isSunday ? "Key Weekend Long Run Session" : "Aerobic Shakeout / Easy Run", body: day.run },
      { time: "08:45 AM – 09:30 AM", type: "nutrition", tag: "NUTRITION", title: "Post-Run Anabolic Window", body: "35g-40g Whey Isolate + 5g Creatine in water. Hot-cold contrast shower." },
      { time: "09:30 AM – 12:30 PM", type: "work", tag: "RECOVERY", title: "Post-Run Feast & Hydration", body: "Eggs, sweet potato hash, fresh fruit, sourdough. Hydration: 1L electrolyte water." },
      { time: "12:30 PM – 02:00 PM", type: "work", tag: "REST", title: "Restorative Power Nap", body: "45–60 minute power nap to accelerate muscle protein synthesis and reset the CNS." },
      { time: "02:30 PM – 03:00 PM", type: "nutrition", tag: isLongRunSunday ? "GLYCOGEN REALIZATION" : "SNACK", title: isLongRunSunday ? "Post-Nap Glycogen Realization (+500 kcal)" : "Midday Nutrient Window", body: isLongRunSunday ? "3 white rice cakes w/ 2 tbsp raw honey + 16 oz organic apple juice (92g fast carbs, +380 kcal). Fully bridges long run energy expenditure." : "Greek yogurt or rice cakes w/ fruit. Sip water." },
      { time: "03:00 PM – 05:00 PM", type: "transit", tag: "TRANSIT & ERRANDS", title: "Active Transit & Errands", body: day.ruck.includes("Zero") ? "Horizontal recovery; minimize foot fatigue." : `Active walking/errands: ${day.ruck}.` },
      { time: "05:00 PM – 05:35 PM", type: "strength", tag: "RECOVERY", title: "Mobility & Tissue Care", body: `${day.strength}. Concludes before civil twilight (${day.civilTwilight}).` },
      { time: "06:00 PM – 07:30 PM", type: "nutrition", tag: "NUTRITION", title: "Iron-Optimized Dinner & Omega-3s", body: "200g lean flank steak or salmon, sweet potatoes, green salad w/ lemon/bell peppers (Vitamin C optimizes iron absorption). 2 softgels NOW Molecularly Distilled Omega-3 Fish Oil (360mg EPA / 240mg DHA) taken with meal fats." },
      { time: "07:30 PM – 08:30 PM", type: "work", tag: "DECOMPRESSION", title: "Reading & Cognitive Down-Regulation", body: "Fiction reading or relaxing with pets. Screen off by 08:30 PM." },
      { time: "08:30 PM – 09:00 PM", type: "nutrition", tag: "TART CHERRY", title: "Anti-Inflammatory Tart Cherry", body: "12 oz Montmorency Tart Cherry Juice (taken separated from red meat dinner)." },
      { time: "09:00 PM – 09:30 PM", type: "nutrition", tag: "NOCTURNAL ANABOLISM", title: "Casein Anchor & Magnesium Bisglycinate", body: "175g low-fat cottage cheese (24g slow-release casein) + 200mg Magnesium Bisglycinate (100% pure chelated, unbuffered). Asleep by 09:30 PM." }
    ];
  } else {
    const isHardDay = day.type.includes("Threshold") || day.type.includes("VO2 Max") || day.type.includes("MP") || day.type.includes("Lock Reps");
    return [
      { time: "04:30 AM – 05:00 AM", type: "nutrition", tag: "NITRATE SATURATION", title: "Pre-Run Nitrate Window", body: isHardDay ? "Beetroot juice shot (6-12 mmol nitrate) taken 2.5-3 hrs pre-run to hit peak plasma nitrite. (Or consumed evening prior at 8:30 PM)." : "Hydration sip: 200 mL water." },
      { time: "05:00 AM – 05:30 AM", type: "nutrition", tag: "PRIMER", title: "Pre-Workout Primer & Fast Carbs", body: "300 mL water + 150mg sodium + 1 banana. Sourdough w/ honey on quality mornings." },
      { time: "05:30 AM – 06:30 AM", type: "run", tag: isRest ? "REST / MOBILITY" : "RUN", title: isRest ? "Morning Passive Mobility" : "Morning Running Session", body: isRest ? "Zero running. 15-min light yoga, hip openers, and ankle circles." : "Morning Run / Shakeout (if shifted AM)" },
      { time: "06:30 AM – 07:00 AM", type: "nutrition", tag: "NUTRITION", title: "Post-Workout Nutrition & Shower", body: "35g Whey Isolate + 5g Creatine in water. Contrast shower (2m hot / 30s cold)." },
      { time: "07:00 AM – 07:15 AM", type: "transit", tag: "ACTIVE COMMUTE", title: "Morning Commute", body: `${day.ruck}. 85-90 RPM Zone 2 cadence if cycling; practice panoramic gaze.` },
      { time: "07:15 AM – 12:00 PM", type: "work", tag: "WORK", title: "Work Block 1", body: "Remote work. 1L water. Monitor 140g protein target." },
      { time: "12:00 PM – 01:00 PM", type: "nutrition", tag: "LUNCH & RUCK", title: "Lunch & Midday Active Reset", body: "170g lean turkey/chicken, 1.5 cups jasmine rice/quinoa, steamed greens (~680 kcal). 15-min walk." },
      { time: "01:00 PM – 04:30 PM", type: "work", tag: "WORK", title: "Work Block 2", body: "Strict 12:00 PM caffeine cutoff. 750 mL water." },
      { time: "04:30 PM – 05:00 PM", type: "nutrition", tag: "TART CHERRY", title: "Afternoon Tart Cherry Dose", body: "12 oz Montmorency Tart Cherry Juice. Separated from dinner to avoid iron/polyphenol binding." },
      { time: "05:00 PM – 06:30 PM", type: "run", tag: "RUN", title: "Evening Run / Commute", body: isRest ? "Commute home. No running." : day.run + `. Finishes exactly by civil twilight: ${day.civilTwilight}` },
      { time: "06:30 PM – 07:30 PM", type: "nutrition", tag: "DINNER", title: "Iron-Optimized Dinner & Omega-3s", body: "200g flank steak/salmon, roasted potatoes, greens w/ citrus dressing (Vitamin C enhances iron absorption). 2 softgels NOW Molecularly Distilled Omega-3 Fish Oil (360mg EPA / 240mg DHA) taken with meal fats." },
      { time: "07:30 PM – 08:30 PM", type: "work", tag: "DECOMPRESSION", title: "Cognitive Decompression", body: "Social connection, audiobooks, or fiction reading. Screens off by 08:30 PM." },
      { time: "08:30 PM – 09:00 PM", type: "strength", tag: "STRENGTH", title: "Evening Strength / Tissue Work", body: day.strength },
      { time: "09:00 PM – 09:30 PM", type: "nutrition", tag: "NOCTURNAL ANABOLISM", title: "Casein Anchor & Bedtime Sleep", body: isHardDay ? "175g low-fat cottage cheese (24g casein) + 200mg Magnesium Bisglycinate (100% pure chelated, unbuffered). Asleep by 09:30 PM." : "200mg Magnesium Bisglycinate (100% pure chelated, unbuffered). Asleep by 09:30 PM." }
    ];
  }
}

const weeksData = masterRawData.map(w => ({
  weekNum: w.weekNum,
  title: w.title,
  theme: w.theme,
  days: w.daysBlueprint.map(d => ({
    date: d.dayName,
    type: d.type,
    runDist: d.run,
    transitLoad: d.ruck,
    strength: d.strength,
    carbTarget: d.carbs,
    civilTwilight: d.dusk,
    timeline: generateDetailedTimeline(d)
  }))
}));

let currentWeekIdx = 0;
let currentDayIdx = 0;

function renderWeekSelector() {
  const container = document.getElementById('weekSelector');
  container.innerHTML = '';
  weeksData.forEach((week, idx) => {
    const btn = document.createElement('button');
    btn.className = `week-btn ${idx === currentWeekIdx ? 'active' : ''}`;
    btn.innerText = `Week ${week.weekNum}`;
    btn.onclick = () => {
      currentWeekIdx = idx;
      currentDayIdx = 0;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDaySelector() {
  const container = document.getElementById('daySelector');
  container.innerHTML = '';
  const currentWeek = weeksData[currentWeekIdx];
  currentWeek.days.forEach((day, idx) => {
    const btn = document.createElement('button');
    const isRace = day.type.includes('RACE') || day.type.includes('Marathon') || day.type.includes('Turkey Trot') || day.type.includes('Charlie Brown');
    btn.className = `day-btn ${idx === currentDayIdx ? 'active' : ''} ${isRace ? 'race-day' : ''}`;
    btn.innerHTML = `<div>${day.date.split(',')[0]}</div><div style="font-size:0.7rem;margin-top:2px;">${day.date.split(',')[1]}</div>`;
    btn.onclick = () => {
      currentDayIdx = idx;
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderDayView() {
  const container = document.getElementById('dayViewContainer');
  const day = weeksData[currentWeekIdx].days[currentDayIdx];
  
  let html = `
    <div class="day-view active">
      <div style="margin-bottom: 16px;">
        <h2 style="font-size: 1.4rem; color: var(--accent-blue);">${day.date} — ${day.type}</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">${weeksData[currentWeekIdx].title} | ${weeksData[currentWeekIdx].theme}</p>
      </div>

      <div class="day-summary-banner">
        <div class="metric-item">
          <span class="metric-label">Running Demand</span>
          <span class="metric-val highlight">${day.runDist}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Transit / Longevity</span>
          <span class="metric-val transit-highlight">${day.transitLoad}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Strength / Mobility</span>
          <span class="metric-val">${day.strength}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Nutrition</span>
          <span class="metric-val alert">${day.carbTarget}</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Civil Twilight Horizon</span>
          <span class="metric-val alert">${day.civilTwilight}</span>
        </div>
      </div>

      <div class="timeline">
  `;

  day.timeline.forEach(item => {
    let tagClass = 'tag-run';
    if(item.type === 'strength') tagClass = 'tag-strength';
    if(item.type === 'nutrition') tagClass = 'tag-nutrition';
    if(item.type === 'work') tagClass = 'tag-desk';
    if(item.type === 'transit') tagClass = 'tag-transit';
    if(item.type === 'race') tagClass = 'tag-race';

    html += `
      <div class="timeline-entry ${item.type}">
        <div class="time-stamp">${item.time}</div>
        <div class="entry-card">
          <div class="entry-title">
            <span>${item.title}</span>
            <span class="entry-tag ${tagClass}">${item.tag}</span>
          </div>
          <div class="entry-body">${item.body}</div>
        </div>
      </div>
    `;
  });

  html += `
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function renderAll() {
  renderWeekSelector();
  renderDaySelector();
  renderDayView();
}

renderAll();
</script>

</body>
</html>
